name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_PASSWORD: runveil-local-only
      DATABASE_URL: postgresql+psycopg://runveil:runveil-local-only@127.0.0.1:5432/runveil
      RUNVEIL_TEST_DATABASE_URL: postgresql+psycopg://runveil:runveil-local-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: npm ci
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - name: Start local dependencies
        run: |
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 90
          docker compose exec -T postgres psql -U runveil -d runveil -v ON_ERROR_STOP=1 -c 'SELECT 1;'
      - name: Validate migrations
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest
      - name: Phase 5 process-death acceptance (offline)
        run: uv run python scripts/phase5_acceptance.py
      - name: Phase 10 sandbox boundary acceptance
        run: |
          docker build --network=none -t runveil-sandbox:phase10a sandbox
          SANDBOX_IMAGE=$(docker image inspect runveil-sandbox:phase10a --format '{{.Id}}')
          uv run python scripts/phase10_sandbox_acceptance.py --image "$SANDBOX_IMAGE" --output /tmp/runveil-sandbox-acceptance.json
          RUNVEIL_SANDBOX_IMAGE="$SANDBOX_IMAGE" uv run pytest packages/persistence/tests/test_sandbox_worker.py packages/persistence/tests/test_sandbox_review.py -k real_docker
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: uv run python scripts/smoke.py
      - name: Dependency logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop local dependencies
        if: always()
        run: docker compose down
