[project]
name = "runveil-persistence"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "runveil-agent-core",
  "sqlalchemy[asyncio]>=2.0.40,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
]

[tool.uv.sources]
runveil-agent-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runveil_persistence"]
