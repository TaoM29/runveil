[project]
name = "runveil-evaluations"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["runveil-agent-core", "runveil-persistence", "runveil-tool-runtime"]

[tool.uv.sources]
runveil-agent-core = { workspace = true }
runveil-persistence = { workspace = true }
runveil-tool-runtime = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runveil_evaluations"]
